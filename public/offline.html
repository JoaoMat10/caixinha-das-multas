<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06130e" />
    <title>Sem ligação — Caixinha das Multas</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #06130e;
        color: #f7f4e9;
      }
      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid #234436;
        border-radius: 24px;
        background: #0d2119;
        box-shadow: 0 24px 60px #0006;
      }
      span {
        display: grid;
        width: 52px;
        height: 52px;
        place-items: center;
        border-radius: 16px;
        background: #dfb34f;
        color: #07150f;
        font-size: 22px;
        font-weight: 900;
      }
      h1 {
        margin: 22px 0 10px;
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      p {
        color: #9bb0a6;
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        width: 100%;
        margin-top: 12px;
        border: 0;
        border-radius: 14px;
        background: #dfb34f;
        color: #07150f;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main>
      <span>€</span>
      <h1>Estás sem ligação</h1>
      <p>
        A aplicação precisa de rede para carregar dados e confirmar operações.
        Nenhuma escrita será guardada ou enviada mais tarde.
      </p>
      <button type="button" onclick="location.reload()">
        Tentar novamente
      </button>
    </main>
  </body>
</html>
